<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#050505">

<title>BE GHAYR — ADMIN</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#050505;
  color:#f4f3ef;
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* LOGIN */

.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-card{
  width:100%;
  max-width:420px;
  border:1px solid #252525;
  background:#090909;
  padding:28px;
}

.brand{
  font-size:20px;
  font-weight:900;
  letter-spacing:6px;
}

.code{
  margin-top:8px;
  color:#777;
  font-size:7px;
  letter-spacing:5px;
}

.login-card h1{
  margin-top:40px;
  font-size:29px;
  font-weight:500;
}

.field{
  margin-top:18px;
}

.field label{
  display:block;
  margin-bottom:7px;
  color:#777;
  font-size:7px;
  letter-spacing:1.8px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid #2b2b2b;
  background:#050505;
  color:#fff;
  outline:none;
}

.field input,
.field select{
  height:50px;
  padding:0 12px;
}

.field textarea{
  min-height:110px;
  padding:12px;
  resize:vertical;
}

.login-btn{
  width:100%;
  height:54px;
  margin-top:20px;
  border:0;
  background:#fff;
  color:#000;
  font-size:8px;
  font-weight:700;
  letter-spacing:2px;
}

.error{
  margin-top:12px;
  color:#c96d6d;
  font-size:8px;
}

/* HEADER */

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  height:74px;
  padding:0 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(5,5,5,.96);
  border-bottom:1px solid #242424;
}

.topbar .brand{
  font-size:14px;
  letter-spacing:4px;
}

.topbar small{
  display:block;
  margin-top:5px;
  color:#777;
  font-size:6px;
  letter-spacing:2px;
}

.actions{
  display:flex;
  gap:7px;
}

.small-btn{
  min-height:38px;
  padding:0 10px;
  border:1px solid #333;
  background:none;
  color:#fff;
  font-size:7px;
  letter-spacing:1px;
}

/* NAV */

.nav{
  position:sticky;
  top:74px;
  z-index:90;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  background:#050505;
  border-bottom:1px solid #242424;
}

.nav button{
  height:51px;
  border:0;
  border-right:1px solid #242424;
  background:#050505;
  color:#666;
  font-size:7px;
  letter-spacing:1.5px;
}

.nav button.active{
  background:#f4f3ef;
  color:#050505;
}

/* GENERAL */

.wrap{
  width:100%;
  max-width:1250px;
  margin:auto;
  padding:25px 13px 80px;
}

.section{
  display:none;
}

.section.active{
  display:block;
}

.page-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:15px;
  margin-bottom:20px;
}

.page-head h1{
  font-size:34px;
  font-weight:500;
  letter-spacing:-1px;
}

.page-head p{
  margin-top:7px;
  color:#777;
  font-size:8px;
}

.primary-btn{
  min-height:43px;
  padding:0 14px;
  border:0;
  background:#fff;
  color:#000;
  font-size:7px;
  font-weight:700;
  letter-spacing:1.4px;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
  margin-bottom:18px;
}

.stat{
  min-height:95px;
  padding:15px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  border:1px solid #242424;
  background:#0b0b0b;
}

.stat span{
  color:#777;
  font-size:6px;
  letter-spacing:1.3px;
}

.stat strong{
  font-size:23px;
  font-weight:500;
}

/* ORDERS */

.orders{
  display:grid;
  gap:9px;
}

.order{
  border:1px solid #242424;
  background:#0a0a0a;
}

.order-head{
  padding:15px;
  display:flex;
  justify-content:space-between;
  gap:10px;
  border-bottom:1px solid #242424;
}

.order-number{
  font-size:9px;
}

.date{
  margin-top:5px;
  color:#777;
  font-size:7px;
}

.status{
  height:38px;
  background:#050505;
  color:#fff;
  border:1px solid #333;
  padding:0 8px;
  font-size:7px;
}

.order-body{
  padding:15px;
}

.customer{
  display:grid;
  gap:12px;
  padding-bottom:14px;
  border-bottom:1px solid #242424;
}

.label{
  color:#666;
  font-size:6px;
  letter-spacing:1.3px;
}

.value{
  margin-top:5px;
  font-size:9px;
  color:#ddd;
  line-height:1.5;
}

.order-items{
  padding:13px 0;
  display:grid;
  gap:8px;
  border-bottom:1px solid #242424;
}

.order-item{
  display:flex;
  justify-content:space-between;
  gap:12px;
  font-size:8px;
}

.order-item small{
  color:#777;
}

.order-footer{
  padding-top:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.delete-btn{
  height:36px;
  padding:0 10px;
  border:1px solid #482323;
  background:none;
  color:#c06c6c;
  font-size:7px;
}

/* PRODUCTS */

.products-admin{
  display:grid;
  gap:10px;
}

.product-card{
  display:grid;
  grid-template-columns:105px 1fr;
  border:1px solid #242424;
  background:#0a0a0a;
  overflow:hidden;
}

.product-card img{
  width:105px;
  height:145px;
  object-fit:cover;
  background:#111;
}

.product-info{
  padding:13px;
}

.product-name{
  font-size:10px;
}

.product-color{
  margin-top:5px;
  color:#777;
  font-size:7px;
}

.product-price{
  margin-top:10px;
  font-size:12px;
}

.product-status{
  margin-top:7px;
  font-size:7px;
}

.live{
  color:#7eb78a;
}

.hidden-status{
  color:#c16f6f;
}

.product-actions{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:13px;
}

.product-actions button{
  min-height:34px;
  padding:0 9px;
  border:1px solid #333;
  background:#050505;
  color:#fff;
  font-size:6px;
  letter-spacing:1px;
}

/* INVENTORY */

.inventory{
  display:grid;
  gap:12px;
}

.stock-product{
  border:1px solid #242424;
  background:#0a0a0a;
}

.stock-head{
  padding:14px;
  border-bottom:1px solid #242424;
}

.stock-head strong{
  font-size:9px;
}

.stock-head small{
  display:block;
  margin-top:5px;
  color:#777;
  font-size:7px;
}

.stock-row{
  min-height:66px;
  padding:10px 13px;
  display:grid;
  grid-template-columns:45px 1fr 60px;
  align-items:center;
  gap:10px;
  border-bottom:1px solid #1c1c1c;
}

.stock-row:last-child{
  border-bottom:0;
}

.stock-row input{
  width:100%;
  height:38px;
  border:1px solid #333;
  background:#050505;
  color:#fff;
  text-align:center;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:500;
  padding:14px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  background:rgba(0,0,0,.8);
  opacity:0;
  visibility:hidden;
  transition:.2s;
}

.modal.active{
  opacity:1;
  visibility:visible;
}

.modal-box{
  width:100%;
  max-width:650px;
  max-height:92vh;
  overflow:auto;
  background:#0c0c0c;
  border:1px solid #2b2b2b;
  padding:20px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modal-head h2{
  font-size:22px;
  font-weight:500;
}

.close-btn{
  width:40px;
  height:40px;
  border:1px solid #333;
  background:none;
  color:#fff;
  font-size:22px;
}

.form-grid{
  display:grid;
  gap:0 10px;
}

.stock-inputs{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

.checkbox{
  margin-top:20px;
  display:flex;
  align-items:center;
  gap:9px;
  font-size:8px;
}

.publish-btn{
  width:100%;
  height:55px;
  margin-top:22px;
  border:0;
  background:#fff;
  color:#000;
  font-size:8px;
  font-weight:700;
  letter-spacing:2px;
}

.loading,
.empty{
  padding:45px 15px;
  border:1px solid #242424;
  text-align:center;
  color:#777;
  font-size:8px;
}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  z-index:1000;
  transform:translate(-50%,20px);
  background:#fff;
  color:#000;
  padding:12px 15px;
  font-size:7px;
  opacity:0;
  visibility:hidden;
  transition:.25s;
}

.toast.show{
  opacity:1;
  visibility:visible;
  transform:translate(-50%,0);
}

@media(min-width:800px){

  .wrap{
    padding:38px 28px 100px;
  }

  .stats{
    grid-template-columns:repeat(4,1fr);
  }

  .customer{
    grid-template-columns:repeat(4,1fr);
  }

  .products-admin{
    grid-template-columns:repeat(2,1fr);
  }

  .inventory{
    grid-template-columns:repeat(2,1fr);
  }

  .form-grid{
    grid-template-columns:1fr 1fr;
  }

  .modal{
    align-items:center;
  }

}

</style>

</head>

<body>

<section class="login" id="loginScreen">

>

<main class="wrap">

>

  </div>

<script>

/* CONFIG */

const SUPABASE_URL =
"https://jcopeyicuzpzjbnokrsl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_7Zeo4ejznLmagRRvBl7UJA_w3ZmeziD";

const ADMIN_UID =
"82e4a6d7-8c07-4b77-9eef-a7047c432744";


const sb =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let activeSection =
"orders";

let ordersData = [];

let productsData = [];

let inventoryData = [];

let editingProductID = null;

let editingFrontImage = "";

let editingBackImage = "";


/* AUTH */

async function init(){

  const {data} =
  await sb.auth.getSession();


  if(
    data.session &&
    data.session.user.id === ADMIN_UID
  ){

    showApp(
      data.session.user
    );

    loadOrders();

  }else{

    showLogin();

  }

}


async function login(){

  const email =
  document
  .getElementById("email")
  .value
  .trim();


  const password =
  document
  .getElementById("password")
  .value;


  const button =
  document
  .getElementById("loginBtn");


  button.disabled = true;

  button.innerText =
  "SIGNING IN...";


  const {
    data,
    error
  } =
  await sb.auth.signInWithPassword({

    email,
    password

  });


  button.disabled = false;

  button.innerText =
  "SIGN IN";


  if(error){

    document
    .getElementById("loginError")
    .innerText =
    error.message;

    return;

  }


  if(
    data.user.id !== ADMIN_UID
  ){

    await sb.auth.signOut();

    document
    .getElementById("loginError")
    .innerText =
    "NOT AUTHORIZED";

    return;

  }


  showApp(
    data.user
  );

  loadOrders();

}


async function logout(){

  await sb.auth.signOut();

  location.reload();

}


function showApp(user){

  document
  .getElementById("loginScreen")
  .classList
  .add("hidden");


  document
  .getElementById("app")
  .classList
  .remove("hidden");


  document
  .getElementById("adminEmail")
  .innerText =
  user.email || "";

}


function showLogin(){

  document
  .getElementById("loginScreen")
  .classList
  .remove("hidden");


  document
  .getElementById("app")
  .classList
  .add("hidden");

}


/* NAV */

async function showSection(name){

  activeSection = name;


  ["orders","products","inventory"]
  .forEach(function(section){

    document
    .getElementById(
      section+"Section"
    )
    .classList
    .toggle(
      "active",
      section === name
    );


    document
    .getElementById(
      section+"Tab"
    )
    .classList
    .toggle(
      "active",
      section === name
    );

  });


  if(name==="orders"){
    loadOrders();
  }

  if(name==="products"){
    loadProducts();
  }

  if(name==="inventory"){
    loadInventory();
  }

}


function refreshCurrent(){

  showSection(
    activeSection
  );

}


/* ORDERS */

async function loadOrders(){

  const el =
  document.getElementById("orders");


  el.innerHTML =
  '<div class="loading">LOADING...</div>';


  const {
    data,
    error
  } =
  await sb
  .from("orders")
  .select("*")
  .order(
    "created_at",
    {
      ascending:false
    }
  );


  if(error){

    el.innerHTML =
    '<div class="empty">'+
    escapeHtml(error.message)+
    '</div>';

    return;

  }


  ordersData =
  data || [];


  renderOrders();

}


function renderOrders(){

  document
  .getElementById("allOrders")
  .innerText =
  ordersData.length;


  document
  .getElementById("newOrders")
  .innerText =
  ordersData.filter(
    x => x.status==="new"
  ).length;


  const completed =
  ordersData.filter(
    x => x.status==="completed"
  );


  document
  .getElementById("completedOrders")
  .innerText =
  completed.length;


  const sales =
  completed.reduce(
    (
      total,
      order
    ) =>
    total +
    Number(order.total||0),
    0
  );


  document
  .getElementById("sales")
  .innerText =
  sales+" JOD";


  const el =
  document.getElementById("orders");


  if(!ordersData.length){

    el.innerHTML =
    '<div class="empty">NO ORDERS</div>';

    return;

  }


  el.innerHTML =
  ordersData
  .map(function(order){

    const items =
    Array.isArray(order.items)
    ?
    order.items
    :
    [];


    const itemsHTML =
    items.map(function(item){

      return `

      <div class="order-item">

        <span>

          ${item.quantity}
          ×
          ${escapeHtml(item.name)}

          <br>

          <small>
            ${escapeHtml(item.color)}
            /
            ${escapeHtml(item.size)}
          </small>

        </span>

        <strong>
          ${item.subtotal}
          JOD
        </strong>

      </div>

      `;

    }).join("");


    return `

    <article class="order">

      <div class="order-head">

        <div>

          <div class="order-number">
            ${escapeHtml(
              getOrderNumber(
                order.notes
              )

              order.id
            )}
          </div>

          <div class="date">
            ${new Date(
              order.created_at
            ).toLocaleString()}
          </div>

        </div>


        <select
          class="status"
          onchange="
            changeOrderStatus(
              '${order.id}',
              this.value
            )
          "
        >

          ${statusOptions(
            order.status
          )}

        </select>

      </div>


      <div class="order-body">

        <div class="customer">

          <div>

            <div class="label">
              CUSTOMER
            </div>

            <div class="value">
              ${escapeHtml(
                order.customer_name
              )}
            </div>

          </div>


          <div>

            <div class="label">
              PHONE
            </div>

            <div class="value">
              ${escapeHtml(
                order.phone
              )}
            </div>

          </div>


          <div>

            <div class="label">
              CITY
            </div>

            <div class="value">
              ${escapeHtml(
                order.city
              )}
            </div>

          </div>


          <div>

            <div class="label">
              ADDRESS
            </div>

            <div class="value">
              ${escapeHtml(
                order.address
              )}
            </div>

          </div>

        </div>


        <div class="order-items">

          ${itemsHTML}

        </div>


        <div class="order-footer">

          <strong>
            ${order.total}
            JOD
          </strong>

          <button
            class="delete-btn"
            onclick="
              deleteOrder(
                '${order.id}'
              )
            "
          >
            DELETE
          </button>

        </div>

      </div>

    </article>

    `;

  })
  .join("");

}


function statusOptions(current){

  return [
    "new",
    "confirmed",
    "shipped",
    "completed",
    "cancelled"
  ]
  .map(function(status){

    return `

    <option
      value="${status}"
      ${status===current
      ?"selected"
      :""}
    >

      ${status.toUpperCase()}

    </option>

    `;

  })
  .join("");

}


async function changeOrderStatus(
  id,
  status
){

  const {error} =
  await sb
  .from("orders")
  .update({
    status
  })
  .eq(
    "id",
    id
  );


  if(error){

    toastMsg(
      "UPDATE FAILED"
    );

    return;

  }


  loadOrders();

}


async function deleteOrder(id){

  if(
    !confirm(
      "Delete this order?"
    )
  ){
    return;
  }


  await sb
  .from("orders")
  .delete()
  .eq(
    "id",
    id
  );


  loadOrders();

}


/* PRODUCTS */

async function loadProducts(){

  const el =
  document
  .getElementById(
    "productsAdmin"
  );


  el.innerHTML =
  '<div class="loading">LOADING PRODUCTS...</div>';


  const {
    data,
    error
  } =
  await sb
  .from("products")
  .select("*")
  .order(
    "sort_order",
    {
      ascending:true
    }
  )
  .order(
    "id",
    {
      ascending:true
    }
  );


  if(error){

    el.innerHTML =
    '<div class="empty">'+
    escapeHtml(error.message)+
    '</div>';

    return;

  }


  productsData =
  data || [];

      <div class="product-info">

        </div>

          )}
        </div>


        <div class="product-price">

            ?

            :

              editProduct(

                ${product.id}
              )
            "

  }).join("");

/* EDIT PRODUCT */

async function editProduct(id){

  const product =
  productsData.find(
    x => x.id===id
  );


  if(!product){
    return;
  }


  editingProductID =
  product.id;


  editingFrontImage =
  product.front_image || "";


  editingBackImage =
  product.back_image || "";


  document
  .getElementById(
    "modalTitle"
  )
  .innerText =
  "EDIT PRODUCT";


  document
  .getElementById(
    "productName"
  )
  .value =
  product.name || "";


  document
  .getElementById(
    "productColor"
  )
  .value =
  product.color || "";


  document
  .getElementById(
    "productPrice"
  )
  .value =
  product.price || 0;


  document
  .getElementById(
    "productDrop"
  )
  .value =
  product.drop_code || "001";


  document
  .getElementById(
    "productBadge"
  )
  .value =
  product.badge || "";


  document
  .getElementById(
    "productSort"
  )
  .value =
  product.sort_order || 0;


  document
  .getElementById(
    "productDescription"
  )
  .value =
  product.description || "";


  document
  .getElementById(
    "productActive"
  )
  .checked =
  product.is_active;


  const {
    data
  } =
  await sb
  .from("inventory")
  .select("*")
  .eq(
    "product_id",
    id
  );


  const stock = {};


  (data||[])
  .forEach(function(row){

    stock[row.size] =
    row.stock;

  });


  document
  .getElementById(
    "stockS"
  )
  .value =
  stock.S || 0;


  document
  .getElementById(
    "stockM"
  )
  .value =
  stock.M || 0;


  document
  .getElementById(
    "stockL"
  )
  .value =
  stock.L || 0;


  document
  .getElementById(
    "stockXL"
  )
  .value =
  stock.XL || 0;


  document
  .getElementById(
    "saveProductBtn"
  )
  .innerText =
  "SAVE CHANGES";


  document
  .getElementById(
    "productModal"
  )
  .classList
  .add("active");

}


/* UPLOAD IMAGE */

async function uploadImage(
  file,
  side
){

  if(!file){
    return "";
  }


  const extension =
  file.name.includes(".")
  ?
  file.name.split(".").pop()
  :
  "jpg";


  const filename =

  Date.now()
  +
  "-"
  +
  Math.random()
  .toString(36)
  .slice(2)
  +
  "-"
  +
  side
  +
  "."
  +
  extension;


  const {
    error
  } =
  await sb.storage
  .from(
    "product-images"
  )
  .upload(
    filename,
    file
  );


  if(error){
    throw error;
  }


  const {
    data
  } =
  sb.storage
  .from(
    "product-images"
  )
  .getPublicUrl(
    filename
  );


  return data.publicUrl;

}


/* SAVE PRODUCT */

async function saveProduct(){

  const name =
  document
  .getElementById(
    "productName"
  )
  .value
  .trim();


  const color =
  document
  .getElementById(
    "productColor"
  )
  .value
  .trim();


  const price =
  Number(
    document
    .getElementById(
      "productPrice"
    )
    .value
  );


  if(
    !name ||
    !color ||
    !price
  ){

    toastMsg(
      "COMPLETE PRODUCT DETAILS"
    );

    return;

  }


  const button =
  document
  .getElementById(
    "saveProductBtn"
  );


  button.disabled = true;

  button.innerText =
  "SAVING...";


  try{

    let front =
    editingFrontImage;


    let back =
    editingBackImage;


    const frontFile =
    document
    .getElementById(
      "frontImage"
    )
    .files[0];


    const backFile =
    document
    .getElementById(
      "backImage"
    )
    .files[0];


    if(frontFile){

      front =
      await uploadImage(
        frontFile,
        "front"
      );

    }


    if(backFile){

      back =
      await uploadImage(
        backFile,
        "back"
      );

    }


    if(
      !front &&
      !editingProductID
    ){

      throw new Error(
        "FRONT IMAGE REQUIRED"
      );

    }


    const payload = {

      name,

      color,

      price,

      description:
      document
      .getElementById(
        "productDescription"
      )
      .value
      .trim(),

      front_image:
      front,

      back_image:
      back || front,

      drop_code:
      document
      .getElementById(
        "productDrop"
      )
      .value
      .trim()
      ||
      "001",

      badge:
      document
      .getElementById(
        "productBadge"
      )
      .value
      .trim(),

      sort_order:
      Number(
        document
        .getElementById(
          "productSort"
        )
        .value
        ||
        0
      ),

      is_active:
      document
      .getElementById(
        "productActive"
      )
      .checked,

      updated_at:
      new Date()
      .toISOString()

    };


    let productID;


    if(editingProductID){

      const {
        error
      } =
      await sb
      .from("products")
      .update(payload)
      .eq(
        "id",
        editingProductID
      );


      if(error){
        throw error;
      }


      productID =
      editingProductID;

    }else{

      const {
        data,
        error
      } =
      await sb
      .from("products")
      .insert(payload)
      .select()
      .single();


      if(error){
        throw error;
      }


      productID =
      data.id;

    }


    const sizes = [

      [
        "S",
        document
        .getElementById(
          "stockS"
        )
        .value
      ],

      [
        "M",
        document
        .getElementById(
          "stockM"
        )
        .value
      ],

      [
        "L",
        document
        .getElementById(
          "stockL"
        )
        .value
      ],

      [
        "XL",
        document
        .getElementById(
          "stockXL"
        )
        .value
      ]

    ];


    const stockRows =
    sizes.map(function(item){

      return {

        product_id:
        productID,

        product_name:
        name,

        color:
        color,

        size:
        item[0],

        stock:
        Math.max(
          0,
          Number(item[1]||0)
        ),

        updated_at:
        new Date()
        .toISOString()

      };

    });


    const {
      error:stockError
    } =
    await sb
    .from("inventory")
    .upsert(
      stockRows,
      {
        onConflict:
        "product_id,size"
      }
    );


    if(stockError){
      throw stockError;
    }


    toastMsg(
      editingProductID
      ?
      "PRODUCT UPDATED"
      :
      "PRODUCT CREATED"
    );


    closeProductModal();


    await loadProducts();

  }catch(error){

    console.error(error);

    toastMsg(
      error.message
      ||
      "SAVE FAILED"
    );

  }


  button.disabled = false;

  button.innerText =
  editingProductID
  ?
  "SAVE CHANGES"
  :
  "PUBLISH PRODUCT";

}

/* INVENTORY */

async function loadInventory(){

  const el =
  document
  .getElementById(
    "inventory"
  );


  el.innerHTML =
  '<div class="loading">LOADING STOCK...</div>';


  const {
    data,
    error
  } =
  await sb
  .from("inventory")
  .select("*")
  .order(
    "product_id",
    {
      ascending:true
    }
  )
  .order(
    "id",
    {
      ascending:true
    }
  );


  if(error){

    el.innerHTML =
    '<div class="empty">'+
    escapeHtml(error.message)+
    '</div>';

    return;

  }


  inventoryData =
  data || [];


  const groups = {};


  inventoryData
  .forEach(function(item){

    if(
      !groups[
        item.product_id
      ]
    ){

      groups[
        item.product_id
      ] = {

        name:
        item.product_name,

        color:
        item.color,

        rows:[]
      };

    }


    groups[
      item.product_id
    ]
    .rows
    .push(item);

  });


  el.innerHTML =
  Object.values(groups)
  .map(function(product){

    const rows =
    product.rows
    .map(function(row){

      return `

      <div class="stock-row">

        <strong>
          ${row.size}
        </strong>

        <input
          id="stock-${row.id}"
          type="number"
          min="0"
          value="${row.stock}"
        >

        <span>
          PCS
        </span>

      </div>

      `;

    })
    .join("");


    return `

    <article class="stock-product">

      <div class="stock-head">

        <strong>
          ${escapeHtml(
            product.name
          )}
        </strong>

        <small>
          ${escapeHtml(
            product.color
          )}
        </small>

      </div>

      ${rows}

    </article>

    `;

  })
  .join("");

}


/* SAVE STOCK */

async function saveAllStock(){

  for(
    const row
    of inventoryData
  ){

    const input =
    document
    .getElementById(
      "stock-"+row.id
    );


    const stock =
    Math.max(
      0,
      Number(
        input.value || 0
      )
    );


    const {error} =
    await sb
    .from("inventory")
    .update({

      stock,

      updated_at:
      new Date()
      .toISOString()

    })
    .eq(
      "id",
      row.id
    );


    if(error){

      toastMsg(
        "STOCK SAVE FAILED"
      );

      return;

    }

  }


  toastMsg(
    "STOCK SAVED"
  );


  loadInventory();

}


/* HELPERS */

function getOrderNumber(notes){

  const match =
  String(notes||"")
  .match(
    /Order:\s*(BG-\d+)/i
  );


  return match
  ?
  match[1]
  :
  "";

}


function escapeHtml(value){

  return String(
    value ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}


let toastTimer;


function toastMsg(message){

  const toast =
  document
  .getElementById("toast");


  toast.innerText =
  message;


  toast
  .classList
  .add("show");


  clearTimeout(
    toastTimer
  );


  toastTimer =
  setTimeout(function(){

    toast
    .classList
    .remove("show");

  },1800);

}
