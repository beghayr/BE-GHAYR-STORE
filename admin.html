<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#050505">

  <title>BE GHAYR — ADMIN</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    :root{
      --bg:#050505;
      --panel:#0d0d0d;
      --line:#232323;
      --text:#f4f3ef;
      --muted:#777;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial,Helvetica,sans-serif;
      background:#050505;
      color:#f4f3ef;
      min-height:100vh;
    }

    button,
    input,
    select{
      font:inherit;
    }

    .hidden{
      display:none !important;
    }

    /* =========================
    LOGIN
    ========================= */

    .login{
      min-height:100vh;

      display:flex;
      align-items:center;
      justify-content:center;

      padding:22px;
    }

    .login-card{
      width:100%;
      max-width:420px;

      border:1px solid #232323;

      background:#090909;

      padding:28px;
    }

    .brand{
      font-size:20px;
      font-weight:900;
      letter-spacing:6px;
    }

    .code{
      margin-top:8px;

      color:#777;

      font-size:7px;
      letter-spacing:5px;
    }

    .login-card h1{
      margin-top:42px;

      font-size:28px;
      font-weight:500;

      letter-spacing:-1px;
    }

    .login-card p{
      margin-top:9px;

      color:#777;

      font-size:10px;
      line-height:1.7;
    }

    .field{
      margin-top:20px;
    }

    .field label{
      display:block;

      margin-bottom:7px;

      color:#777;

      font-size:7px;
      letter-spacing:2px;
    }

    .field input{
      width:100%;
      height:52px;

      padding:0 13px;

      border:1px solid #2b2b2b;

      background:#050505;
      color:#fff;

      outline:none;
    }

    .login-btn{
      width:100%;
      height:54px;

      margin-top:18px;

      border:0;

      background:#fff;
      color:#000;

      font-size:8px;
      letter-spacing:2.4px;

      font-weight:700;

      cursor:pointer;
    }

    .error{
      min-height:18px;

      margin-top:13px;

      color:#d06b6b;

      font-size:8px;
      line-height:1.6;
    }

    /* =========================
    APP
    ========================= */

    .app{
      min-height:100vh;
    }

    .topbar{
      position:sticky;

      top:0;

      z-index:20;

      min-height:76px;

      padding:0 18px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      gap:20px;

      background:
        rgba(5,5,5,.95);

      backdrop-filter:
        blur(14px);

      border-bottom:
        1px solid #232323;
    }

    .topbar .brand{
      font-size:14px;
      letter-spacing:4px;
    }

    .topbar small{
      display:block;

      margin-top:5px;

      color:#777;

      font-size:6px;
      letter-spacing:3px;
    }

    .top-actions{
      display:flex;

      gap:8px;
    }

    .mini-btn{
      min-height:38px;

      padding:0 12px;

      border:
        1px solid #333;

      background:none;
      color:#fff;

      font-size:7px;
      letter-spacing:1.5px;

      cursor:pointer;
    }

    .wrap{
      max-width:1250px;

      margin:auto;

      padding:24px 14px 70px;
    }

    .title-row{
      display:flex;

      justify-content:space-between;
      align-items:end;

      gap:20px;

      margin-bottom:20px;
    }

    .title-row h1{
      font-size:34px;

      font-weight:500;

      letter-spacing:-1.5px;
    }

    .title-row p{
      margin-top:8px;

      color:#777;

      font-size:9px;
    }

    /* =========================
    STATS
    ========================= */

    .stats{
      display:grid;

      grid-template-columns:
        repeat(2,minmax(0,1fr));

      gap:8px;

      margin-bottom:18px;
    }

    .stat{
      border:
        1px solid #232323;

      background:#0d0d0d;

      padding:17px;
    }

    .stat-label{
      color:#777;

      font-size:7px;
      letter-spacing:1.7px;
    }

    .stat-value{
      margin-top:13px;

      font-size:24px;

      font-weight:500;
    }

    /* =========================
    FILTERS
    ========================= */

    .filters{
      display:grid;

      grid-template-columns:1fr;

      gap:8px;

      margin-bottom:18px;
    }

    .filters input,
    .filters select{
      width:100%;
      height:46px;

      padding:0 12px;

      border:
        1px solid #2b2b2b;

      background:#090909;
      color:#fff;

      outline:none;
    }

    /* =========================
    ORDERS
    ========================= */

    .orders{
      display:grid;

      gap:10px;
    }

    .order{
      border:
        1px solid #232323;

      background:#0a0a0a;

      overflow:hidden;
    }

    .order-head{
      padding:16px;

      display:flex;

      align-items:flex-start;
      justify-content:space-between;

      gap:16px;

      border-bottom:
        1px solid #232323;
    }

    .order-id{
      font-size:9px;

      letter-spacing:1.5px;
    }

    .order-date{
      margin-top:6px;

      color:#777;

      font-size:7px;
    }

    .status{
      min-width:105px;
      height:38px;

      padding:0 8px;

      border:
        1px solid #333;

      background:#050505;
      color:#fff;

      font-size:7px;
    }

    .order-body{
      padding:16px;
    }

    .customer{
      display:grid;

      grid-template-columns:1fr;

      gap:8px;

      padding-bottom:15px;

      border-bottom:
        1px solid #232323;
    }

    .info-label{
      color:#777;

      font-size:6px;
      letter-spacing:1.6px;
    }

    .info-value{
      margin-top:5px;

      color:#ddd;

      font-size:9px;

      line-height:1.6;

      word-break:break-word;
    }

    .items{
      padding:14px 0;

      display:grid;

      gap:8px;

      border-bottom:
        1px solid #232323;
    }

    .item{
      display:flex;

      justify-content:space-between;

      gap:15px;

      font-size:8px;

      line-height:1.6;
    }

    .item small{
      color:#777;

      font-size:7px;
    }

    .order-footer{
      padding-top:15px;

      display:flex;

      justify-content:space-between;
      align-items:center;

      gap:14px;
    }

    .total{
      font-size:15px;
    }

    .payment{
      margin-top:5px;

      color:#777;

      font-size:7px;
    }

    .delete-btn{
      border:
        1px solid #402020;

      background:none;

      color:#b96969;

      min-height:36px;

      padding:0 11px;

      font-size:7px;

      cursor:pointer;
    }

    .empty{
      padding:60px 15px;

      text-align:center;

      border:
        1px solid #232323;

      color:#777;

      font-size:9px;
    }

    .loading{
      padding:50px 15px;

      text-align:center;

      color:#777;

      font-size:8px;

      letter-spacing:2px;
    }

    /* =========================
    DESKTOP
    ========================= */

    @media(min-width:760px){

      .wrap{
        padding:
          36px 28px 90px;
      }

      .stats{
        grid-template-columns:
          repeat(4,1fr);
      }

      .filters{
        grid-template-columns:
          1fr 220px;
      }

      .customer{
        grid-template-columns:
          repeat(4,1fr);
      }

      .order-head,
      .order-body{
        padding:20px;
      }

    }

  </style>

</head>

<body>


<!-- =========================
LOGIN
========================= -->

<section
  class="login"
  id="loginScreen"
>

  <div class="login-card">

    <div class="brand">
      BE GHAYR
    </div>

    <div class="code">
      ADMIN / 001
    </div>


    <h1>
      CONTROL PANEL
    </h1>


    <p>
      Sign in with your BE GHAYR admin account.
    </p>


    <div class="field">

      <label>
        EMAIL
      </label>

      <input
        id="email"
        type="email"
        autocomplete="email"
      >

    </div>


    <div class="field">

      <label>
        PASSWORD
      </label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
      >

    </div>


    <button
      class="login-btn"
      id="loginBtn"
      onclick="login()"
    >
      SIGN IN
    </button>


    <div
      class="error"
      id="loginError"
    ></div>

  </div>

</section>


<!-- =========================
ADMIN APP
========================= -->

<section
  class="app hidden"
  id="app"
>

  <header class="topbar">

    <div>

      <div class="brand">
        BE GHAYR
      </div>

      <small>
        ADMIN / 001
      </small>

    </div>


    <div class="top-actions">

      <button
        class="mini-btn"
        onclick="loadOrders()"
      >
        REFRESH
      </button>


      <button
        class="mini-btn"
        onclick="logout()"
      >
        LOG OUT
      </button>

    </div>

  </header>


  <main class="wrap">

    <div class="title-row">

      <div>

        <h1>
          ORDERS
        </h1>

        <p id="adminEmail"></p>

      </div>

    </div>


    <!-- =========================
    STATS
    ========================= -->

    <section class="stats">

      <div class="stat">

        <div class="stat-label">
          ALL ORDERS
        </div>

        <div
          class="stat-value"
          id="statAll"
        >
          0
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          NEW
        </div>

        <div
          class="stat-value"
          id="statNew"
        >
          0
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          COMPLETED
        </div>

        <div
          class="stat-value"
          id="statCompleted"
        >
          0
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          COMPLETED SALES
        </div>

        <div
          class="stat-value"
          id="statSales"
        >
          0 JOD
        </div>

      </div>

    </section>


    <!-- =========================
    FILTERS
    ========================= -->

    <section class="filters">

      <input
        id="search"
        placeholder="Search name, phone, city..."
        oninput="renderOrders()"
      >


      <select
        id="statusFilter"
        onchange="renderOrders()"
      >

        <option value="all">
          ALL STATUS
        </option>

        <option value="new">
          NEW
        </option>

        <option value="confirmed">
          CONFIRMED
        </option>

        <option value="shipped">
          SHIPPED
        </option>

        <option value="completed">
          COMPLETED
        </option>

        <option value="cancelled">
          CANCELLED
        </option>

      </select>

    </section>


    <!-- =========================
    ORDERS
    ========================= -->

    <div
      id="orders"
      class="orders"
    >

      <div class="loading">
        LOADING ORDERS...
      </div>

    </div>

  </main>

</section>


<script>

/* =========================
SUPABASE
========================= */

const SUPABASE_URL =
  "https://jcopeyicuzpzjbnokrsl.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_7Zeo4ejznLmagRRvBl7UJA_w3ZmeziD";


const sb =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
STATE
========================= */

let allOrders = [];


/* =========================
ELEMENTS
========================= */

const loginScreen =
  document.getElementById(
    "loginScreen"
  );


const app =
  document.getElementById(
    "app"
  );


const loginError =
  document.getElementById(
    "loginError"
  );


const loginBtn =
  document.getElementById(
    "loginBtn"
  );


const ordersEl =
  document.getElementById(
    "orders"
  );


/* =========================
START
========================= */

async function init(){

  const { data } =
    await sb.auth.getSession();


  if(data.session){

    showApp(
      data.session.user
    );


    await loadOrders();

  }else{

    showLogin();

  }


  sb.auth.onAuthStateChange(
    async function(
      event,
      session
    ){

      if(session){

        showApp(
          session.user
        );

      }else{

        showLogin();

      }

    }
  );

}


/* =========================
SHOW LOGIN
========================= */

function showLogin(){

  loginScreen
    .classList
    .remove(
      "hidden"
    );


  app
    .classList
    .add(
      "hidden"
    );

}


/* =========================
SHOW APP
========================= */

function showApp(user){

  loginScreen
    .classList
    .add(
      "hidden"
    );


  app
    .classList
    .remove(
      "hidden"
    );


  document
    .getElementById(
      "adminEmail"
    )
    .textContent =
      user.email || "";

}


/* =========================
LOGIN
========================= */

async function login(){

  const email =
    document
      .getElementById(
        "email"
      )
      .value
      .trim();


  const password =
    document
      .getElementById(
        "password"
      )
      .value;


  loginError.textContent =
    "";


  if(
    !email ||
    !password
  ){

    loginError.textContent =
      "ENTER EMAIL AND PASSWORD";


    return;

  }


  loginBtn.disabled =
    true;


  loginBtn.textContent =
    "SIGNING IN...";


  const {
    data,
    error
  } =
    await sb.auth
      .signInWithPassword({

        email:
          email,

        password:
          password

      });


  loginBtn.disabled =
    false;


  loginBtn.textContent =
    "SIGN IN";


  if(error){

    loginError.textContent =
      error.message;


    return;

  }


  showApp(
    data.user
  );


  await loadOrders();

}


/* =========================
LOGOUT
========================= */

async function logout(){

  await sb.auth.signOut();


  allOrders = [];


  showLogin();

}


/* =========================
LOAD ORDERS
========================= */

async function loadOrders(){

  ordersEl.innerHTML =

    '<div class="loading">LOADING ORDERS...</div>';


  const {
    data,
    error
  } =
    await sb
      .from(
        "orders"
      )
      .select(
        "*"
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    ordersEl.innerHTML =

      `<div class="empty">

        ERROR:
        ${escapeHtml(
          error.message
        )}

      </div>`;


    return;

  }


  allOrders =
    data || [];


  updateStats();


  renderOrders();

}


/* =========================
STATS
========================= */

function updateStats(){

  const all =
    allOrders.length;


  const newCount =
    allOrders.filter(
      order =>
        order.status ===
        "new"
    ).length;


  const completed =
    allOrders.filter(
      order =>
        order.status ===
        "completed"
    );


  const completedSales =
    completed.reduce(
      function(
        sum,
        order
      ){

        return (
          sum +
          Number(
            order.total || 0
          )
        );

      },
      0
    );


  document
    .getElementById(
      "statAll"
    )
    .textContent =
      all;


  document
    .getElementById(
      "statNew"
    )
    .textContent =
      newCount;


  document
    .getElementById(
      "statCompleted"
    )
    .textContent =
      completed.length;


  document
    .getElementById(
      "statSales"
    )
    .textContent =

      completedSales
        .toFixed(2)
        .replace(
          ".00",
          ""
        )

      +

      " JOD";

}


/* =========================
RENDER ORDERS
========================= */

function renderOrders(){

  const q =
    document
      .getElementById(
        "search"
      )
      .value
      .trim()
      .toLowerCase();


  const status =
    document
      .getElementById(
        "statusFilter"
      )
      .value;


  const filtered =
    allOrders.filter(
      function(order){

        const haystack = [

          order.customer_name,

          order.phone,

          order.city,

          order.address,

          order.payment_method,

          order.notes

        ]
        .join(" ")
        .toLowerCase();


        const searchOk =
          !q ||
          haystack.includes(q);


        const statusOk =
          status === "all" ||
          order.status === status;


        return (
          searchOk &&
          statusOk
        );

      }
    );


  if(!filtered.length){

    ordersEl.innerHTML =

      '<div class="empty">NO ORDERS FOUND.</div>';


    return;

  }


  ordersEl.innerHTML =

    filtered
      .map(
        orderCard
      )
      .join("");

}


/* =========================
ORDER CARD
========================= */

function orderCard(order){

  const items =
    Array.isArray(
      order.items
    )
      ?
      order.items
      :
      [];


  const created =
    new Date(
      order.created_at
    )
    .toLocaleString();


  const itemsHtml =

    items
      .map(
        function(item){

          return `

            <div class="item">

              <span>

                ${Number(
                  item.quantity || 0
                )}
                ×
                ${escapeHtml(
                  item.name || ""
                )}

                <br>

                <small>

                  ${escapeHtml(
                    item.color || ""
                  )}

                  /

                  ${escapeHtml(
                    item.size || ""
                  )}

                </small>

              </span>


              <strong>

                ${Number(

                  item.subtotal
                  ??
                  (
                    (item.price || 0)
                    *
                    (item.quantity || 0)
                  )

                )}

                JOD

              </strong>

            </div>

          `;

        }
      )
      .join("");


  return `

    <article class="order">

      <div class="order-head">

        <div>

          <div class="order-id">

            ${
              escapeHtml(
                extractOrderNumber(
                  order.notes
                )
                ||
                order.id
              )
            }

          </div>


          <div class="order-date">

            ${
              escapeHtml(
                created
              )
            }

          </div>

        </div>


        <select

          class="status"

          onchange="
            changeStatus(
              '${order.id}',
              this.value
            )
          "

        >

          ${
            statusOptions(
              order.status
            )
          }

        </select>

      </div>


      <div class="order-body">

        <div class="customer">

          <div>

            <div class="info-label">
              CUSTOMER
            </div>

            <div class="info-value">

              ${
                escapeHtml(
                  order.customer_name
                  ||
                  "-"
                )
              }

            </div>

          </div>


          <div>

            <div class="info-label">
              PHONE
            </div>

            <div class="info-value">

              ${
                escapeHtml(
                  order.phone
                  ||
                  "-"
                )
              }

            </div>

          </div>


          <div>

            <div class="info-label">
              CITY
            </div>

            <div class="info-value">

              ${
                escapeHtml(
                  order.city
                  ||
                  "-"
                )
              }

            </div>

          </div>


          <div>

            <div class="info-label">
              ADDRESS
            </div>

            <div class="info-value">

              ${
                escapeHtml(
                  order.address
                  ||
                  "-"
                )
              }

            </div>

          </div>

        </div>


        <div class="items">

          ${
            itemsHtml
            ||
            '<div class="info-value">No item data</div>'
          }

        </div>


        <div class="order-footer">

          <div>

            <div class="total">

              ${
                Number(
                  order.total || 0
                )
              }

              JOD

            </div>


            <div class="payment">

              ${
                escapeHtml(
                  order.payment_method
                  ||
                  "-"
                )
              }

            </div>

          </div>


          <button

            class="delete-btn"

            onclick="
              deleteOrder(
                '${order.id}'
              )
            "

          >
            DELETE
          </button>

        </div>

      </div>

    </article>

  `;

}


/* =========================
STATUS OPTIONS
========================= */

function statusOptions(current){

  const statuses = [

    [
      "new",
      "NEW"
    ],

    [
      "confirmed",
      "CONFIRMED"
    ],

    [
      "shipped",
      "SHIPPED"
    ],

    [
      "completed",
      "COMPLETED"
    ],

    [
      "cancelled",
      "CANCELLED"
    ]

  ];


  return statuses
    .map(
      function(
        item
      ){

        const value =
          item[0];


        const label =
          item[1];


        return `

          <option

            value="${value}"

            ${
              current === value
              ?
              "selected"
              :
              ""
            }

          >

            ${label}

          </option>

        `;

      }
    )
    .join("");

}


/* =========================
CHANGE STATUS
========================= */

async function changeStatus(
  id,
  status
){

  const {
    error
  } =
    await sb
      .from(
        "orders"
      )
      .update({

        status:
          status

      })
      .eq(
        "id",
        id
      );


  if(error){

    alert(
      error.message
    );


    await loadOrders();


    return;

  }


  const local =
    allOrders.find(
      order =>
        order.id === id
    );


  if(local){

    local.status =
      status;

  }


  updateStats();


  renderOrders();

}


/* =========================
DELETE ORDER
========================= */

async function deleteOrder(id){

  const ok =
    confirm(
      "Delete this order permanently?"
    );


  if(!ok){
    return;
  }


  const {
    error
  } =
    await sb
      .from(
        "orders"
      )
      .delete()
      .eq(
        "id",
        id
      );


  if(error){

    alert(
      error.message
    );


    return;

  }


  allOrders =
    allOrders.filter(
      order =>
        order.id !== id
    );


  updateStats();


  renderOrders();

}


/* =========================
GET BG ORDER NUMBER
========================= */

function extractOrderNumber(
  notes
){

  const match =
    String(
      notes || ""
    )
    .match(
      /Order:\s*(BG-\d+)/i
    );


  return match
    ?
    match[1]
    :
    "";

}


/* =========================
SECURITY
========================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}

      ){

        login();
